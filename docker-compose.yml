# LetterSheets server stack: MySQL + Go API + Caddy (auto-TLS reverse proxy).
# The Electron desktop client connects to https://${LS_DOMAIN}/api/execute.
#
#   cp deploy/.env.example .env   # then edit secrets
#   docker compose up -d --build
#
# See DEPLOY.md for the full runbook (incl. the security prerequisites).

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${LS_DB_NAME:-lettersheets}
      MYSQL_USER: ${LS_DB_USER:-lettersheets}
      MYSQL_PASSWORD: ${LS_DB_PASSWORD:?set LS_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
      # Schema + stored procedures load automatically on FIRST start only.
      - ./deploy/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build: ./server
    restart: unless-stopped
    environment:
      LS_SERVER_HOST: "0.0.0.0"
      LS_SERVER_PORT: "8080"
      LS_DB_HOST: db
      LS_DB_PORT: "3306"
      LS_DB_USER: ${LS_DB_USER:-lettersheets}
      LS_DB_PASSWORD: ${LS_DB_PASSWORD:?}
      LS_DB_NAME: ${LS_DB_NAME:-lettersheets}
      # TLS is terminated by Caddy, so the API speaks plain HTTP behind it and
      # trusts Caddy's forwarded client IP for audit logs.
      LS_TRUST_PROXY_HEADERS: "true"
      LS_ALLOWED_ORIGINS: ${LS_ALLOWED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LS_DOMAIN: ${LS_DOMAIN:?set LS_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  db_data:
  caddy_data:
  caddy_config:
